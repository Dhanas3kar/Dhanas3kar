# Save this file as: .github/workflows/contribution-games.yml  in Dhanas3kar/Dhanas3kar
#
# This generates dist/space-invaders.gif on the default branch, which the
# README's "> contribution --battle" section links to via:
#   https://raw.githubusercontent.com/Dhanas3kar/Dhanas3kar/main/dist/space-invaders.gif
# Without this workflow enabled, that image will 404 forever (as the
# original "./gh-space-shooter.gif" relative path already did).

name: generate contribution game
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate space-invaders game from contribution grid
        uses: Trilokia/GithubContributionGames@v1.0.6
        with:
          GAME: "space_invaders"
          GITHUB_USERNAME: Dhanas3kar
          OUTPUT_NAME: "space-invaders.gif"

      - name: commit generated gif
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution game gif"
          file_pattern: "dist/*.gif"
